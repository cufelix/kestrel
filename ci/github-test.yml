name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kestrel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: tests
        run: bun test
        working-directory: packages/kestrel
      - name: typecheck
        run: bun turbo typecheck --filter=@kestrel/agent --filter=opencode

# Not at .github/workflows/test.yml because pushing a workflow file needs the
# `workflow` OAuth scope, which this machine's token does not have. Copy it
# there once the scope is granted:
#   mkdir -p .github/workflows && cp ci/github-test.yml .github/workflows/test.yml
